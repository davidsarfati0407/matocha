<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>MATOCHA — Iced matcha latte</title>
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/archivo-normal.woff2") format("woff2");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("assets/fonts/instrument-serif-normal.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Instrument Serif";
        src: url("assets/fonts/instrument-serif-italic.woff2") format("woff2");
        font-weight: 400;
        font-style: italic;
        font-display: block;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f3efe5;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Archivo", sans-serif;
        color: #161713;
        background: #f3efe5;
      }
      .layer {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        pointer-events: none;
      }
      .clip {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        transform-origin: 0 0;
      }
      .abs {
        position: absolute;
        left: 0;
        top: 0;
      }
      svg {
        overflow: visible;
      }

      /* ------------------------------------------------------------ ground */
      #bg {
        background: linear-gradient(168deg, #fbf8f1 0%, #f3efe5 48%, #e9e2d3 100%);
      }
      #light {
        background:
          radial-gradient(58% 34% at 84% 3%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 72%),
          radial-gradient(70% 30% at 20% 62%, rgba(255, 252, 244, 0.55) 0%, rgba(255, 252, 244, 0) 70%);
      }
      .mullion {
        position: absolute;
        background: rgba(22, 23, 19, 0.06);
        filter: blur(16px);
      }
      .table {
        background: linear-gradient(180deg, #e4dccb 0%, #ddd3bf 45%, #d6cbb4 100%);
      }
      .horizon {
        height: 3px;
        background: rgba(22, 23, 19, 0.1);
      }
      .contact {
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(15, 42, 30, 0.42), rgba(15, 42, 30, 0));
      }
      .cast {
        background: linear-gradient(90deg, rgba(15, 42, 30, 0) 0%, rgba(15, 42, 30, 0.12) 60%, rgba(15, 42, 30, 0.2) 100%);
        filter: blur(20px);
      }

      /* ------------------------------------------------------------ glass ink */
      #G {
        --ink: #161713;
      }
      #G .ink {
        stroke: var(--ink);
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #G .inkfill {
        stroke: var(--ink);
      }

      /* ------------------------------------------------------------ type */
      #type {
        z-index: 5;
      }
      .tw {
        position: absolute;
        left: 80px;
        top: 196px;
        font-family: "Archivo", sans-serif;
        font-weight: 760;
        font-size: 214px;
        line-height: 0.9;
        letter-spacing: -0.055em;
        white-space: nowrap;
        opacity: 0;
      }
      .tw.ivory {
        color: #f3efe5;
      }
      .ch {
        display: inline-block;
        will-change: transform;
      }
      .mask {
        display: block;
        overflow: hidden;
        padding: 0 0.06em 0.3em 0;
        margin-bottom: -0.3em;
      }
      .mask > .line {
        display: block;
      }
      .serif-it {
        font-family: "Instrument Serif", serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: -0.015em;
      }
      #t-hook .l1 {
        font-size: 128px;
        line-height: 1;
      }
      #t-hook .l2 {
        font-size: 134px;
        line-height: 0.95;
        font-weight: 780;
        letter-spacing: -0.05em;
      }
      #t-tear .half {
        position: absolute;
        left: 0;
        top: 0;
      }
      #t-tear .top {
        clip-path: polygon(0 0, 100% 0, 100% 52%, 92% 58%, 84% 49%, 76% 57%, 68% 48%, 60% 56%, 52% 47%, 44% 56%, 36% 48%, 28% 57%, 20% 49%, 12% 57%, 4% 50%, 0 55%);
      }
      #t-tear .bot {
        clip-path: polygon(0 55%, 4% 50%, 12% 57%, 20% 49%, 28% 57%, 36% 48%, 44% 56%, 52% 47%, 60% 56%, 68% 48%, 76% 57%, 84% 49%, 92% 58%, 100% 52%, 100% 100%, 0 100%);
      }
      #t-tear .ghost {
        visibility: hidden;
      }
      #t-water {
        position: absolute;
        left: 84px;
        top: 410px;
        font-size: 62px;
        line-height: 1;
        opacity: 0;
        white-space: nowrap;
      }
      #t-hero {
        position: absolute;
        left: 80px;
        top: 212px;
        opacity: 0;
        white-space: nowrap;
      }
      #t-hero .l1 {
        font-size: 150px;
        font-weight: 760;
        letter-spacing: -0.055em;
        line-height: 0.95;
      }
      #t-hero .l2 {
        font-size: 172px;
        line-height: 0.95;
      }
      #t-cta {
        position: absolute;
        left: 80px;
        top: 214px;
        width: 920px;
        opacity: 0;
      }
      #cta-mark {
        display: flex;
        align-items: center;
        gap: 26px;
      }
      #cta-glass {
        width: 100px;
        height: 110px;
        flex: none;
      }
      #cta-word {
        font-size: 150px;
        font-weight: 620;
        letter-spacing: -0.05em;
        line-height: 0.86;
        white-space: nowrap;
      }
      #cta-tag {
        margin-top: 30px;
        font-size: 92px;
        line-height: 1;
        white-space: nowrap;
      }
      #cta-facts {
        margin-top: 34px;
        font-size: 25px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        opacity: 0;
        white-space: nowrap;
      }
      #cta-pill {
        display: inline-flex;
        align-items: center;
        gap: 22px;
        margin-top: 38px;
        padding: 26px 44px 26px 40px;
        border-radius: 999px;
        background: #e07a5f;
        color: #161713;
        font-size: 36px;
        font-weight: 720;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 0;
        transform-origin: 18% 50%;
        position: relative;
        overflow: hidden;
      }
      #cta-pill .arrow {
        font-weight: 500;
        letter-spacing: 0;
      }
      #cta-pill .shine {
        position: absolute;
        top: -20%;
        left: 0;
        width: 120px;
        height: 140%;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 100%);
        opacity: 0.8;
      }

      /* ------------------------------------------------------------ chrome */
      #chrome {
        z-index: 6;
        --ci: #161713;
      }
      .lbl {
        position: absolute;
        font-family: "Archivo", sans-serif;
        font-weight: 600;
        font-size: 24px;
        line-height: 1;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--ci);
        white-space: nowrap;
        opacity: 0;
      }
      .lbl .dim {
        opacity: 0.6;
      }
      .ticker {
        position: relative;
        display: inline-block;
        width: 2.1em;
        height: 1em;
        overflow: hidden;
        vertical-align: top;
      }
      .ticker span {
        position: absolute;
        left: 0;
        top: 0;
        opacity: 0;
      }
      #ch-wave {
        position: absolute;
        right: 80px;
        bottom: 84px;
        opacity: 0;
      }
      #ch-wave path {
        stroke: var(--ci);
        fill: none;
        stroke-linecap: round;
      }

      /* ------------------------------------------------------------ grain */
      #grain {
        z-index: 7;
        overflow: hidden;
      }
      #grain .tex {
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        /* texture from the registry's grain-overlay component, held still like the site's paper grain */
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.16;
        mix-blend-mode: multiply;
      }
    </style>
  </head>

        const prand = (n) => {
          const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;

        const E = (n) => EC[n] || (EC[n] = gsap.parseEase(n));

          return e ? E(e)(p) : p;

        // piecewise keyframes [[t, v, ease], ...] — the ease shapes the segment ending at that key
        function K(t, keys) {
          if (t <= keys[0][0]) return keys[0][1];
          for (let i = 1; i < keys.length; i++) {
            if (t <= keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], P(t, keys[i - 1][0], keys[i][0], keys[i][2]));
          }
          return keys[keys.length - 1][1];

        const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
        function mix(a, b, p) {

        const f2 = (v) => (Math.round(v * 100) / 100).toString();

        // ------------------------------------------------------------------ geometry

        const MOUTH = { x: (POUR.x - GL.left) / GL.k, y: (POUR.y - GL.top) / GL.k };

        // ------------------------------------------------------------------ the box
        const BODY = "M-58 -74 C-56 -18 -47 34 -38 61 C-35 71 -26 78 -13 78 L13 78 C26 78 34 71 37 61 C46 34 55 -18 57 -74";
        const INTERIOR = "M-50 -68 C-48 -16 -40 32 -32 56 C-29 65 -22 70 -13 70 L13 70 C22 70 29 65 32 56 C40 32 48 -16 50 -68 Z";
        const STICKS = [];

            </g>`;
        }
        function emblemWave(level, ph) {
          let d = `M-80 120 L-80 ${f2(level + 3 * Math.sin(ph))}`;
          for (let x = -80; x <= 90; x += 10) {

          return d + " L90 120 Z";

        function lidGeom(phi) {
          const a = (phi * Math.PI) / 180;
          const ox = -46 * Math.cos(a);
          const oy = 44 * Math.cos(a) - 104 * Math.sin(a);
          return {
            d: `M108 106 L436 106 L${f2(436 + ox)} ${f2(106 + oy)} L${f2(108 + ox)} ${f2(106 + oy)} Z`,

        $("A-box").innerHTML = boxMarkup("A", false, false);

        (function setHeroLid() {

        // ------------------------------------------------------------------ procedural pools
        const G = {

        const RIBBONS = [

          { x: 151, L: 20, t0: 22.6, w: 3.0, dir: 1, curl: -1.0, c: "#94B968" },

          { x: 101, L: 28, t0: 21.95, w: 5.0, dir: -1, curl: -1.0, c: "#F4EFE3" },

        ];
        const ribbons = RIBBONS.map((d) => el("path", { fill: d.c, opacity: 0, d: "" }, $("G-tendrils")));
        const powder = [];
        for (let i = 0; i < 52; i++) {

            el: el("circle", { r: f2(0.9 + prand(i + 90) * 1.1), fill: c, opacity: 0 }, $("G-powder")),
            te: 9.92 + (1.44 * (i + prand(i + 91))) / 52,

            vp: (prand(i + 93) - 0.5) * 26,

        const puffs = [];
        for (let i = 0; i < 5; i++) puffs.push(el("circle", { r: 1, fill: "#A9C77F", opacity: 0 }, $("G-puffs")));
        const ICE = [
          { T: 20.0, dx: 75, dy: 6, rot: -11, w: 34, h: 32, rx: 6 },
          { T: 20.3125, dx: 121, dy: 14, rot: 9, w: 30, h: 29, rx: 6 },
          { T: 20.625, dx: 98, dy: 26, rot: -4, w: 27, h: 26, rx: 5 },
        ];
        const iceEls = ICE.map(() => null);
        [2, 0, 1].forEach((i) => {
          const c = ICE[i];
          const g = el("g", { opacity: 0 }, $("G-ice"));
          el("rect", { x: -c.w / 2, y: -c.h / 2, width: c.w, height: c.h, rx: c.rx, fill: "#F3EFE5", "fill-opacity": "0.9", class: "inkfill", "stroke-width": "4" }, g);
          el("path", { d: `M${-c.w / 2 + 6} ${-c.h / 2 + 7} L${-c.w / 2 + 6} ${-c.h / 2 + 15}`, stroke: "#FFFFFF", "stroke-width": "3", "stroke-linecap": "round", opacity: "0.9" }, g);

        });
        const drops = [];
        for (let i = 0; i < 30; i++) drops.push(el("circle", { r: f2(1.6 + prand(i + 120) * 1.8), fill: i % 4 === 3 ? "#C9DCA6" : "#79A84B", opacity: 0 }, $("G-drops")));
        const tearPuff = [];
        for (let i = 0; i < 14; i++) tearPuff.push({ el: el("circle", { r: 8, fill: ["#8DB85A", "#79A84B", "#A9C77F"][i % 3], opacity: 0 }, $("C-dust")), soft: true });

        // ------------------------------------------------------------------ liquid helpers (glass viewBox units)
        const waveY = (x, S, a, ph) => S + a * (0.62 * Math.sin(x * 0.0654 + ph) + 0.38 * Math.sin(x * 0.103 - ph * 1.37 + 1.1));
        function bodyPath(S, a, ph, bottom) {
          let d = `M24 ${bottom} L24 ${f2(waveY(24, S, a, ph))}`;
          for (let x = 30; x <= 176; x += 6) d += ` L${x} ${f2(waveY(x, S, a, ph))}`;
          return d + ` L176 ${bottom} Z`;
        }
        function bandPath(top, a1, ph1, bot, a2, ph2) {
          let d = `M24 ${f2(waveY(24, top, a1, ph1))}`;
          for (let x = 30; x <= 176; x += 6) d += ` L${x} ${f2(waveY(x, top, a1, ph1))}`;
          for (let x = 176; x >= 24; x -= 6) d += ` L${x} ${f2(waveY(x, bot, a2, ph2))}`;
          return d + " Z";
        }
        function streamPath(xc, yTop, yBot, w, t, wob) {
          if (yBot - yTop < 0.5) return "";
          const n = Math.max(14, Math.min(140, Math.ceil((yBot - yTop) / 5)));
          let L = "", R = "";
          for (let i = 0; i <= n; i++) {
            const y = yTop + ((yBot - yTop) * i) / n;
            const x = xc + wob * Math.sin(y * 0.045 - t * 13) + wob * 0.5 * Math.sin(y * 0.11 + t * 7);
            const ww = w * (0.86 + 0.14 * Math.sin(y * 0.07 + t * 9));
            L += `${i ? " L" : "M"}${f2(x - ww / 2)} ${f2(y)}`;
            R = ` L${f2(x + ww / 2)} ${f2(y)}` + R;
          }
          return L + R + " Z";
        }

        // ------------------------------------------------------------------ cameras
        const camAKeys = [
          [0, { x: EMBLEM.x, y: EMBLEM.y, s: 3.45, r: -7 }],
          [0.95, { x: EMBLEM.x, y: EMBLEM.y, s: 3.9, r: -5 }, "sine.out"],
          [2.5, { x: 540, y: 1000, s: 1.07, r: 0 }, "power3.inOut"],
          [6.3, { x: 540, y: 1004, s: 1.1, r: 0 }, "sine.inOut"],
          [7.5, CAM_A_END, "power3.inOut"],
        ];
        const camCKeys = [
          [7.5, CAM_C_TEAR],
          [8.45, CAM_C_TEAR],
          [9.7, { x: 540, y: 960, s: 1.0, r: 0 }, "power3.inOut"],
          [12.5, { x: 540, y: 985, s: 1.035, r: 0 }, "sine.inOut"],
          [14.45, { x: 540, y: 1000, s: 1.05, r: 0 }, "sine.inOut"],
          [15.35, { x: 540, y: 1180, s: 1.18, r: 0 }, "power2.inOut"],
          [20.0, { x: 540, y: 1186, s: 1.22, r: 0 }, "sine.inOut"],
          [21.2, { x: 540, y: 1190, s: 1.23, r: 0 }],
          [24.6, { x: 540, y: 1300, s: 1.38, r: 0 }, "sine.inOut"],
          [25.0, { x: 540, y: 1300, s: 1.385, r: 0 }],
          [26.55, { x: 315, y: 688, s: 0.8, r: 0 }, "power3.inOut"],
          [30.0, { x: 318, y: 698, s: 0.825, r: 0 }, "sine.inOut"],
        ];
        function camAt(t, keys) {
          if (t <= keys[0][0]) return Object.assign({}, keys[0][1]);
          for (let i = 1; i < keys.length; i++) {
            if (t <= keys[i][0]) {
              const a = keys[i - 1][1], b = keys[i][1];
              const p = P(t, keys[i - 1][0], keys[i][0], keys[i][2]);
              return { x: lerp(a.x, b.x, p), y: lerp(a.y, b.y, p), s: Math.exp(lerp(Math.log(a.s), Math.log(b.s), p)), r: lerp(a.r, b.r, p) };
            }
          }
          return Object.assign({}, keys[keys.length - 1][1]);
        }
        const camCss = (c) => `translate(540px,960px) rotate(${f2(c.r)}deg) scale(${c.s.toFixed(5)}) translate(${f2(-c.x)}px,${f2(-c.y)}px)`;
        // a whisper of motion blur that follows camera speed (zero at rest, so cuts stay clean)
        function camBlur(t, keys) {
          const dt = 1 / 60;
          const a = camAt(t - dt, keys), b = camAt(t + dt, keys);
          const vz = Math.abs(Math.log(b.s) - Math.log(a.s)) / (2 * dt);
          const vxy = (Math.hypot(b.x - a.x, b.y - a.y) * b.s) / (2 * dt);
          const px = Math.min(3.2, vz * 1.5 + vxy / 1200);
          return px > 0.35 ? `blur(${f2(px)}px)` : "none";
        }

        // ------------------------------------------------------------------ render(t): every procedural layer, pure function of t
        const camA = $("camA"), camC = $("camC");
        const A = { lid: $("A-lid"), print: $("A-lidprint"), liq: $("A-emliq"), sheen: $("A-sheen"), boxwrap: $("A-boxwrap"), contact: $("A-contactwrap") };
        const Csheen = $("C-sheen");
        const stickWrap = $("C-stickwrap"), topPiece = $("C-toppiece"), mouth = $("C-mouth");
        const greenLayer = $("C-green"), boxC = $("C-boxwrap"), glassEl = $("G");
        const CHROME = [
          { el: $("ch-tl"), x: 290, y: 104 },
          { el: $("ch-tr"), x: 880, y: 104 },
          { el: $("ch-bl"), x: 400, y: 1816 },
          { el: $("ch-wave"), x: 890, y: 1822 },
        ];
        const waveFill = $("ch-wave-fill");
        const whiskShake = $("t-whisk-shake");
        const T_WHISK0 = 15.546875, WF = 3.2;

        function greenLevel(t) {
          // fill fraction before milk: water 0 → 0.30, ice adds 0.02 per cube
          let f = 0.36 * P(t, 12.95, 14.55, "sine.out");
          ICE.forEach((c) => (f += 0.02 * P(t, c.T, c.T + 0.25, "power2.out")));
          return f;
        }
        function milkTop(t) {
          return lerp(194, 126, P(t, 21.62, 24.25, "sine.inOut"));
        }
        function surfaceAt(t) {
          const Sg = 194 - greenLevel(t) * 132;
          const ym = milkTop(t);
          return ym < 193.9 ? Math.min(Sg, ym - 55.4) : Sg;
        }
        function amplitudeAt(t) {
          let a = K(t, [[12.9, 2.2], [13.2, 3.8, "sine.out"], [14.4, 3.2], [14.9, 2.4, "sine.inOut"], [15.6, 2.4], [15.95, 6.4, "power2.out"], [18.6, 6.4], [19.7, 2.2, "sine.out"], [21.5, 2.2], [22.0, 3.0, "sine.out"], [24.0, 3.0], [24.8, 1.9, "sine.inOut"]]);
          ICE.forEach((c) => {
            if (t > c.T) a += 3.4 * Math.exp(-(t - c.T) * 4.5);
          });
          return a;
        }
        const phaseAt = (t) => 1.5 * t + 24 * P(t, 15.6, 18.75) + 3 * P(t, 12.95, 14.5);
        function whiskX(t) {
          const A0 = 16 * P(t, 15.6, 15.85, "sine.out") * (1 - P(t, 18.5, 18.78, "sine.in"));
          return { x: 100 + A0 * Math.sin(2 * Math.PI * WF * (t - T_WHISK0)), a: A0 };
        }
        function whiskTransform(t) {
          const w = whiskX(t);
          let y = 186;
          if (t < 15.62) y = lerp(-640, 186, P(t, 15.12, 15.62, "expo.out"));
          if (t > 18.78) y = lerp(186, -720, P(t, 18.78, 19.18, "power3.in"));
          y += 1.6 * Math.sin(2 * Math.PI * 2 * WF * (t - T_WHISK0)) * (w.a / 16);
          const rot = (-w.a / 16) * 4 * Math.cos(2 * Math.PI * WF * (t - T_WHISK0));
          return `translate(${f2(w.x)} ${f2(y)}) rotate(${f2(rot)} 0 -200)`;
        }

        function render(t) {
          // ---------------- world A
          if (t < 7.6) {
            camA.style.transform = camCss(camAt(t, camAKeys));
            camA.style.filter = camBlur(t, camAKeys);
            const lvl = K(t, [[0.55, 92], [1.35, 14, "power2.out"]]);
            A.liq.setAttribute("d", emblemWave(lvl, t * 2.2));
            const fl = P(t, 2.4, 2.9, "sine.out") * (1 - P(t, 4.6, 5.0, "sine.inOut"));
            const fy = -7 * Math.sin((2 * Math.PI * (t - 2.5)) / 2.5) * fl;
            A.boxwrap.style.transform = `translate(0px, ${f2(fy)}px)`;
            A.contact.style.transform = `scale(${f2(1 + fy * 0.006)}, 1)`;
            A.contact.style.opacity = f2(1 + fy * 0.03);
            A.sheen.setAttribute("x", f2(lerp(-220, 560, P(t, 3.0, 4.1, "power2.inOut"))));
            // lid hinge
            const phi = K(t, [[5.05, 0], [5.52, 124, "power3.out"], [5.8, 103, "sine.inOut"], [6.05, 110, "sine.inOut"], [6.3, 107, "sine.inOut"]]);
            const g = lidGeom(phi);
            A.lid.setAttribute("d", g.d);
            A.lid.setAttribute("fill", g.inner ? mix("#CFC7B4", "#E5DECF", P(phi, 20, 90)) : mix("#1C4A34", "#2A5E44", P(phi, 0, 22)));
            A.print.setAttribute("transform", g.m);
            A.print.setAttribute("opacity", g.inner ? f2(P(phi, 30, 80)) : "0");
            // sticks spring up, hero lifts out
            STICKS.forEach((s, i) => {
              const u = $("A-s" + i);
              let y = lerp(CLOSED_TOP, s.top, P(t, 5.4 + s.delay, 5.4 + s.delay + 0.55, "back.out(2.1)"));
              if (s.hero) y = lerp(y, HERO_UP_TOP, P(t, 6.22, 7.5, "power2.inOut"));
              u.setAttribute("y", f2(y));
            });
          }

          // ---------------- world C
          if (t >= 7.45) {
            const cam = camAt(t, camCKeys);
            if (t > 8.125 && t < 8.6) {
              const k = t - 8.125;
              cam.x += 5 * Math.exp(-k / 0.07) * Math.sin(2 * Math.PI * 27 * k);
              cam.y += 4 * Math.exp(-k / 0.07) * Math.cos(2 * Math.PI * 23 * k);
            }
            camC.style.transform = camCss(cam);
            camC.style.filter = t > 7.5 ? camBlur(t, camCKeys) : "none";

            // the stick: lean, rip, swing over the glass, pour, tap, exit
            let px = STICK_C_REST.x, py = STICK_C_REST.y;
            let r = K(t, [[7.5, 0], [8.06, 2.2, "sine.inOut"], [8.16, -3.2, "power2.out"], [8.5, 0, "sine.inOut"]]);
            const sw = P(t, 8.55, 9.75, "power3.inOut");
            px = lerp(px, POUR.x, sw);
            py = lerp(py, POUR.y, sw);
            r = lerp(r, POUR.r, sw);
            if (t > 9.75 && t < 11.35) r += 1.3 * Math.sin(2 * Math.PI * 9 * (t - 9.75)) * P(t, 9.75, 9.95) * (1 - P(t, 11.15, 11.35));
            [11.4, 11.58].forEach((tt) => {
              if (t > tt) r += 3.5 * Math.exp(-(t - tt) / 0.045) * (t - tt < 0.02 ? (t - tt) / 0.02 : 1);
            });
            const ex = P(t, 11.75, 12.3, "power3.in");
            px += 520 * ex;
            py -= 980 * ex;
            r += 40 * ex;
            stickWrap.style.transform = `translate(${f2(px)}px, ${f2(py)}px) rotate(${f2(r)}deg)`;
            stickWrap.style.opacity = t > 12.35 ? "0" : "1";
            // top piece peels around its left end, then flies off
            const pe = P(t, 8.125, 8.26, "power2.out");
            const fly = P(t, 8.26, 8.8, "power2.in");
            topPiece.setAttribute("transform", `translate(${f2(-60 * fly - 4 * pe)} ${f2(-14 * pe - 520 * fly)}) rotate(${f2(-24 * pe - 70 * fly)} 8 32)`);
            topPiece.setAttribute("opacity", t > 8.8 ? "0" : "1");
            mouth.setAttribute("opacity", f2(P(t, 8.13, 8.2)));
            // tear puff (world space, at the mouth)
            tearPuff.forEach((pp, i) => {
              const c = pp.el;
              const life = pp.soft ? 1.1 : 0.75;
              const k = t - 8.13 - (pp.soft ? 0 : prand(i + 163) * 0.06);
              if (k <= 0 || k > life) return c.setAttribute("opacity", "0");
              const ang = -Math.PI / 2 + (prand(i + 160) - 0.5) * (pp.soft ? 1.6 : 2.4);
              const sp = pp.soft ? 140 + prand(i + 161) * 220 : 260 + prand(i + 161) * 420;
              const tau = pp.soft ? 0.32 : 0.18;
              const drag = tau * (1 - Math.exp(-k / tau));
              const x = STICK_C_REST.x + Math.cos(ang) * sp * drag + (prand(i + 162) - 0.5) * (pp.soft ? 50 : 30);
              const y = STICK_C_REST.y - 8 + Math.sin(ang) * sp * drag + (pp.soft ? 40 : 520) * k * k;
              c.setAttribute("cx", f2(x));
              c.setAttribute("cy", f2(y));
              if (pp.soft) {
                c.setAttribute("r", f2((10 + prand(i + 150) * 14) * (1 + k * 2.2)));
                c.setAttribute("opacity", f2(0.55 * Math.pow(1 - k / life, 1.4)));
              } else {
                c.setAttribute("r", f2(1.6 + prand(i + 151) * 2.6));
                c.setAttribute("opacity", f2(0.95 * (1 - k / life)));
              }
            });

            // ---------------- the glass interior
            const S = surfaceAt(t);
            const amp = amplitudeAt(t);
            const ph = phaseAt(t);
            const liquidOn = t > 12.9;

            // powder mound
            const mh = 15 * P(t, 10.5, 11.95, "power1.out");
            if (mh > 0.2) {
              const w = 20 + mh * 1.3;
              let d = `M${f2(101 - w - 4)} 192`;
              for (let i = 0; i <= 16; i++) {
                const u = -1 + (2 * i) / 16;
                const y = 189.5 - mh * Math.pow(Math.max(0, 1 - u * u), 0.85) + 0.8 * Math.sin(i * 2.1);
                d += ` L${f2(101 + u * w)} ${f2(y)}`;
              }
              G.mound.setAttribute("d", d + ` L${f2(101 + w + 4)} 192 Z`);
              moundDots.forEach((c, i) => {
                const u = (prand(i + 410) - 0.5) * 1.5;
                c.setAttribute("cx", f2(101 + u * w));
                c.setAttribute("cy", f2(189.5 - mh * Math.pow(Math.max(0, 1 - u * u), 0.85) * prand(i + 411) - 0.5));
                c.setAttribute("opacity", "0.8");
              });
            } else {
              G.mound.setAttribute("d", "");
              moundDots.forEach((c) => c.setAttribute("opacity", "0"));
            }

            // liquid body + colour (diluted → murky → whisked vivid)
            if (liquidOn) {
              const col = t < 15.8 ? mix("#93AA6E", "#64803F", P(t, 12.95, 13.9)) : mix("#64803F", "#79A84B", P(t, 15.8, 17.6, "sine.inOut"));
              G.green.setAttribute("fill", col);
              G.green.setAttribute("d", bodyPath(S, amp, ph, 214));
            } else G.green.setAttribute("d", "");

            // clumps of unmixed powder
            specks.forEach((c, i) => {
              const o = P(t, 13.15, 13.6) * (1 - P(t, 15.9, 16.8));
              if (o <= 0) return c.setAttribute("opacity", "0");
              const x = 58 + prand(i + 300) * 84 + 4 * Math.sin(t * 1.3 + i);
              c.setAttribute("cx", f2(x));
              c.setAttribute("cy", f2(waveY(x, S, amp, ph) + 3 + prand(i + 301) * 12));
              c.setAttribute("opacity", f2(o * 0.9));
            });

            // bubbles (water, whisk, milk)
            bubbles.forEach((c, i) => {
              const win = [[12.95, 14.9], [15.65, 19.3], [21.6, 24.4]];
              let on = false, y = 0, x = 0;
              for (const [a, b] of win) {
                if (t < a || t > b) continue;
                const per = 0.9 + prand(i + 60) * 0.8;
                const q = ((t - a) / per + prand(i + 61)) % 1;
                y = 186 - q * (186 - S);
                x = 56 + prand(i + 62 + Math.floor((t - a) / per) * 7) * 88 + 2.5 * Math.sin(t * 6 + i);
                on = q > 0.04 && y > S + 2.5;
              }
              c.setAttribute("opacity", on ? "0.75" : "0");
              if (on) {
                c.setAttribute("cx", f2(x));
                c.setAttribute("cy", f2(y));
              }
            });

            // milk: rises from the bottom, pushes the green up, marbles at the seam
            const ym = milkTop(t);
            if (ym < 193.5) {
              const ma = 2.4 + 1.2 * P(t, 21.7, 22.2) * (1 - P(t, 23.9, 24.6));
              const mph = ph * 0.6 + 1.7;
              G.milk.setAttribute("d", bodyPath(ym, ma, mph, 214));
              G.band.setAttribute("d", bandPath(ym - 9, ma * 1.3, mph + 0.6, ym + 7, ma, mph));
            } else {
              G.milk.setAttribute("d", "");
              G.band.setAttribute("d", "");
            }
            RIBBONS.forEach((d, i) => {
              const g = P(t, d.t0, d.t0 + 1.6, "sine.out");
              if (g <= 0 || ym > 193) return ribbons[i].setAttribute("opacity", "0");
              const len = d.L * g * (1 - 0.25 * P(t, 24.4, 28, "sine.inOut"));
              const base = ym + 1.2 * Math.sin(d.x * 0.07 + ph * 0.6) - d.dir * 2;
              let L = "", R = "";
              for (let k = 0; k <= 12; k++) {
                const u = k / 12;
                const sway = d.curl * (5 * Math.sin(u * 2.6 + t * 0.9 + i) * u + 7 * u * u);
                const hw = (d.w * (0.6 + 0.4 * g) * (1 - 0.8 * u)) / 2;
                const x = d.x + sway, y = base + d.dir * len * u;
                L += `${k ? " L" : "M"}${f2(x - hw)} ${f2(y)}`;
                R = ` L${f2(x + hw)} ${f2(y)}` + R;
              }
              ribbons[i].setAttribute("d", L + R + " Z");
              ribbons[i].setAttribute("opacity", f2((d.dir > 0 ? 0.72 : 0.88) * g));
            });

            // foam from the whisk
            const fo = 7.5 * P(t, 15.95, 18.5, "sine.out");
            if (fo > 0.1 && liquidOn) {
              G.foam.setAttribute("d", bandPath(S - fo, amp * 0.85, ph + 0.15, S + 1.6, amp, ph));
              foamDots.forEach((c, i) => {
                const x = 50 + prand(i + 80) * 100;
                const y = waveY(x, S, amp, ph) - fo * (0.2 + prand(i + 81) * 0.6);
                c.setAttribute("cx", f2(x + 1.5 * Math.sin(t * 2 + i)));
                c.setAttribute("cy", f2(y));
                c.setAttribute("opacity", f2(0.85 * (fo / 7.5)));
              });
            } else {
              G.foam.setAttribute("d", "");
              foamDots.forEach((c) => c.setAttribute("opacity", "0"));
            }

            // powder stream: mean ballistic path + seeded particles
            const g0 = 840, VX = -45, VY = 53.6;
            const yLand = 189 - mh - 2;
            const tauLand = (-VY + Math.sqrt(VY * VY + 2 * g0 * (yLand - MOUTH.y))) / g0;
            const tHead = Math.min(t - 9.92, tauLand), tTail = Math.max(0, t - 11.36);
            if (tHead > tTail && t > 9.92) {
              let L = "", R = "";
              const n = 16;
              for (let i = 0; i <= n; i++) {
                const tau = tTail + ((tHead - tTail) * i) / n;
                const x = MOUTH.x + VX * tau;
                const y = MOUTH.y + VY * tau + 0.5 * g0 * tau * tau;
                const w = (5.2 - 2.6 * (tau / tauLand)) / 2;
                L += `${i ? " L" : "M"}${f2(x - w)} ${f2(y)}`;
                R = ` L${f2(x + w)} ${f2(y)}` + R;
              }
              G.pstream.setAttribute("d", L + R + " Z");
            } else G.pstream.setAttribute("d", "");
            powder.forEach((p) => {
              const tau = t - p.te;
              const vx = VX * p.vs + p.vp * 0.77, vy = VY * p.vs + p.vp * 0.64;
              const y = MOUTH.y + vy * tau + 0.5 * g0 * tau * tau;
              if (tau <= 0 || y > yLand + 1) return p.el.setAttribute("opacity", "0");
              p.el.setAttribute("cx", f2(MOUTH.x + vx * tau));
              p.el.setAttribute("cy", f2(y));
              p.el.setAttribute("opacity", "0.95");
            });
            puffs.forEach((c, i) => {
              const per = 0.36;
              const k = t - 10.55 - i * (per / 5);
              if (k < 0 || t > 12.1) return c.setAttribute("opacity", "0");
              const q = (k % per) / per;
              c.setAttribute("cx", f2(101 + (prand(i + 170 + Math.floor(k / per)) - 0.5) * 16));
              c.setAttribute("cy", f2(yLand - 2 - q * 6));
              c.setAttribute("r", f2(3 + q * 11));
              c.setAttribute("opacity", f2(0.38 * (1 - q)));
            });

            // water stream
            const gS = 5000, YT = -420;
            const hW = YT + 0.5 * gS * Math.pow(Math.max(0, t - 12.45), 2);
            const tW = t > 14.15 ? YT + 0.5 * gS * Math.pow(t - 14.15, 2) : YT;
            const sBotW = Math.min(hW, liquidOn ? S : 189);
            if (t > 12.45 && tW < sBotW) {
              G.water.setAttribute("d", streamPath(124, tW, sBotW, 7.6, t, 1.1));
              G.waterhl.setAttribute("d", streamPath(122.6, tW, sBotW, 2.2, t, 1.1));
            } else {
              G.water.setAttribute("d", "");
              G.waterhl.setAttribute("d", "");
            }

            // milk stream + the column it drives through the green
            const hM = YT + 0.5 * gS * Math.pow(Math.max(0, t - 21.1), 2);
            const tM = t > 23.75 ? YT + 0.5 * gS * Math.pow(t - 23.75, 2) : YT;
            const sBotM = Math.min(hM, S);
            if (t > 21.1 && tM < sBotM) {
              G.milkstream.setAttribute("d", streamPath(122, tM, sBotM, 9.5, t, 1.4));
              G.milkshade.setAttribute("d", streamPath(125.5, tM, sBotM, 2.4, t, 1.4));
            } else {
              G.milkstream.setAttribute("d", "");
              G.milkshade.setAttribute("d", "");
            }
            const colOn = P(t, 21.6, 21.75) * (1 - P(t, 23.95, 24.45));
            if (colOn > 0 && ym < 193.5) {
              G.column.setAttribute("d", streamPath(122, S + 1, ym + 2, 10 + 6 * (1 - colOn), t * 0.7, 2.2));
              G.column.setAttribute("opacity", f2(0.8 * colOn));
            } else G.column.setAttribute("d", "");

            // ice: drop, splash, bob, ride the rising surface
            ICE.forEach((c, i) => {
              const g = iceEls[i];
              const t0 = c.T - 0.38;
              if (t < t0) return g.setAttribute("opacity", "0");
              const x = c.dx;
              const restY = waveY(x, S, amp * 0.5, ph) + c.dy;
              let y, rot = c.rot;
              if (t < c.T) {
                const q = (t - t0) / 0.38;
                y = restY - 330 * (1 - q * q);
                rot = c.rot - 30 * (1 - q);
              } else {
                const k = t - c.T;
                y = restY + 7 * Math.exp(-k * 6) * Math.sin(k * 15) + 1.2 * Math.sin(t * 1.6 + i * 2);
                rot = c.rot + 6 * Math.exp(-k * 5) * Math.sin(k * 12) + 1.5 * Math.sin(t * 1.2 + i);
              }
              g.setAttribute("transform", `translate(${f2(x)} ${f2(y)}) rotate(${f2(rot)})`);
              g.setAttribute("opacity", "1");
            });
            drops.forEach((d, j) => {
              const ci = Math.floor(j / 7);
              let k, x0, y0, vx, vy;
              if (ci < 3) {
                const c = ICE[ci];
                k = t - c.T;
                x0 = c.dx;
                y0 = S - 2;
                const ang = -Math.PI / 2 + (prand(j + 200) - 0.5) * 2.1;
                const sp = 70 + prand(j + 201) * 110;
                vx = Math.cos(ang) * sp;
                vy = Math.sin(ang) * sp;
              } else {
                const per = 0.22;
                const kk = t - 21.62 - (j - 21) * 0.025;
                if (kk < 0 || t > 23.9) return d.setAttribute("opacity", "0");
                k = kk % per;
                x0 = 122;
                y0 = S - 1;
                const seed = j * 13 + Math.floor(kk / per);
                const ang = -Math.PI / 2 + (prand(seed + 220) - 0.5) * 2.4;
                const sp = 40 + prand(seed + 221) * 60;
                vx = Math.cos(ang) * sp;
                vy = Math.sin(ang) * sp;
              }
              if (k <= 0 || k > 0.6) return d.setAttribute("opacity", "0");
              const yy = y0 + vy * k + 0.5 * 840 * k * k;
              if (yy > y0 + 1) return d.setAttribute("opacity", "0");
              d.setAttribute("cx", f2(x0 + vx * k));
              d.setAttribute("cy", f2(yy));
              d.setAttribute("fill", ci < 3 ? (j % 4 === 3 ? "#C9DCA6" : "#79A84B") : "#F4EFE3");
              d.setAttribute("opacity", "1");
            });

            // whisk + its ghost trail (reads as motion blur)
            if (t > 15.1 && t < 19.2) {
              G.whiskall.setAttribute("opacity", "1");
              G.whisk.setAttribute("transform", whiskTransform(t));
              G.wg1.setAttribute("transform", whiskTransform(t - 0.028));
              G.wg2.setAttribute("transform", whiskTransform(t - 0.056));
              const blur = whiskX(t).a / 16;
              G.wg1.setAttribute("opacity", f2(0.3 * blur));
              G.wg2.setAttribute("opacity", f2(0.16 * blur));
            } else G.whiskall.setAttribute("opacity", "0");

            // the green world: iris in at 15 s, iris out (hole grows) at 25 s
            let inkP = 0;
            if (t >= 14.98 && t < 25.75) {
              greenLayer.style.opacity = "1";
              const rIn = 1650 * P(t, 14.98, 15.62, "power3.inOut");
              greenLayer.style.clipPath = `circle(${f2(rIn)}px at 3040px 3980px)`;
              const rOut = 3300 * P(t, 25.0, 25.72, "power2.in");
              const m = rOut > 0 ? `radial-gradient(circle at 3040px 3980px, rgba(0,0,0,0) ${f2(rOut)}px, #000 ${f2(rOut + 2)}px)` : "none";
              greenLayer.style.maskImage = m;
              greenLayer.style.webkitMaskImage = m;
              inkP = P(rIn, 190, 440) * (1 - P(rOut, 190, 440));
              // chrome labels flip colour as the iris edge passes each of them
              const icx = (540 - cam.x) * cam.s + 540, icy = (1480 - cam.y) * cam.s + 960;
              CHROME.forEach((L) => {
                const d = Math.hypot(L.x - icx, L.y - icy);
                const g = P(rIn * cam.s - d, -70, 70) * (1 - P(rOut * cam.s - d, -70, 70));
                L.el.style.setProperty("--ci", mix("#161713", "#F3EFE5", g));
              });
            } else {
              greenLayer.style.opacity = "0";
              CHROME.forEach((L) => L.el.style.setProperty("--ci", "#161713"));
            }
            glassEl.style.setProperty("--ink", mix("#161713", "#F3EFE5", inkP));

            // hero box slides in beside the latte
            const bx = lerp(-940, 0, P(t, 25.1, 26.6, "power3.out"));
            boxC.style.transform = `translate(${f2(bx)}px, 0px)`;
            boxC.style.visibility = t < 25.05 ? "hidden" : "visible";
            Csheen.setAttribute("x", f2(lerp(-220, 560, P(t, 28.3, 29.3, "power2.inOut"))));
          }

          // ---------------- screen-space bits
          whiskShake.style.transform = `translate(${f2(4 * Math.sin(2 * Math.PI * WF * (t - T_WHISK0)) * P(t, 15.6, 15.9) * (1 - P(t, 18.5, 18.8)))}px, 0px)`;
          waveFill.style.strokeDashoffset = f2(1 - P(t, 2.6, 27.4));
          $("mullions").style.transform = `translate(${f2(18 * Math.sin(t * 0.22))}px, ${f2(6 * Math.sin(t * 0.17))}px)`;
        }

        // ------------------------------------------------------------------ the timeline
        const tl = gsap.timeline({ paused: true });
        const clock = { t: 0 };
        tl.to(clock, { t: 30, duration: 30, ease: "none", onUpdate: () => render(clock.t) }, 0);

        // emblem draws itself, then the print lands while the camera pulls back
        tl.set("#A-em-body", { opacity: 1 }, 0.04);
        tl.set("#A-em-rim", { opacity: 1 }, 0.3);
        tl.set("#A-em-base", { opacity: 1 }, 0.66);
        tl.fromTo("#A-print1", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.25);
        tl.fromTo("#A-print2", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 1.4);
        tl.fromTo("#A-em-body", { strokeDashoffset: 0.985 }, { strokeDashoffset: 0, duration: 0.72, ease: "power2.out" }, 0.04);
        tl.fromTo("#A-em-rim", { strokeDashoffset: 0.985 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 0.3);
        tl.fromTo("#A-em-base", { strokeDashoffset: 0.97 }, { strokeDashoffset: 0, duration: 0.2, ease: "power3.out" }, 0.66);

        // hook
        tl.set("#t-hook", { opacity: 1 }, 2.3);
        tl.fromTo("#t-hook .l1", { yPercent: 110 }, { yPercent: 0, duration: 0.75, ease: "expo.out" }, 2.32);
        tl.fromTo("#t-hook .l2 .ch", { yPercent: 115, rotation: 6 }, { yPercent: 0, rotation: 0, duration: 0.6, ease: "power4.out", stagger: 0.026 }, 2.46);
        tl.to("#t-hook", { y: -46, opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 4.72);

        // chrome
        tl.fromTo(["#ch-tl", "#ch-bl"], { opacity: 0, y: 10 }, { opacity: 0.82, y: 0, duration: 0.5, ease: "power2.out", stagger: 0.1 }, 2.6);
        tl.fromTo("#ch-tr", { opacity: 0, y: 10 }, { opacity: 0.82, y: 0, duration: 0.4, ease: "power2.out" }, 4.92);
        tl.to("#ch-bl", { opacity: 0, duration: 0.25, ease: "power1.in" }, 6.75);
        tl.to("#ch-bl", { opacity: 0.82, duration: 0.4, ease: "power1.out" }, 9.65);
        tl.fromTo("#ch-wave", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "sine.out" }, 2.75);
        const tick = document.querySelectorAll(".ticker span");
        [5.0, 7.5, 10.0, 15.0, 20.0].forEach((T, i) => {
          tl.fromTo(tick[i], { yPercent: 100, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.34, ease: "power3.out" }, T);
          if (i > 0) tl.to(tick[i - 1], { yPercent: -100, opacity: 0, duration: 0.26, ease: "power2.in" }, T - 0.02);
        });
        tl.to(["#ch-tl", "#ch-tr", "#ch-bl", "#ch-wave"], { opacity: 0, duration: 0.35, ease: "power1.in" }, 27.2);

        // Open.
        tl.fromTo("#t-open", { opacity: 0, scale: 1.32, filter: "blur(14px)", transformOrigin: "0% 60%" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.48, ease: "expo.out" }, 4.98);
        tl.to("#t-open", { y: -70, opacity: 0, duration: 0.24, ease: "power2.in" }, 7.28);

        // Tear.
        tl.set("#t-tear", { opacity: 1 }, 7.48);
        tl.fromTo("#t-tear .top", { x: -80, rotation: -5, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: 0.4, ease: "back.out(1.7)" }, 7.48);
        tl.fromTo("#t-tear .bot", { x: 80, rotation: 4, opacity: 0 }, { x: 0, rotation: 0, opacity: 1, duration: 0.4, ease: "back.out(1.7)" }, 7.5);
        tl.to("#t-tear .top", { x: -14, y: -16, rotation: -4, duration: 0.09, ease: "power2.out" }, 8.125);
        tl.to("#t-tear .top", { x: 0, y: 0, rotation: 0, duration: 0.42, ease: "elastic.out(1, 0.45)" }, 8.215);
        tl.to("#t-tear", { y: -60, opacity: 0, duration: 0.24, ease: "power2.in" }, 9.78);

        // Pour. (+ a splash of water)
        tl.set("#t-pour", { opacity: 1 }, 9.95);
        tl.fromTo("#t-pour .ch", { yPercent: -150, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "bounce.out", stagger: 0.07 }, 9.95);
        tl.fromTo("#t-water", { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 12.5);
        tl.to(["#t-pour", "#t-water"], { opacity: 0, filter: "blur(12px)", duration: 0.3, ease: "power1.in" }, 14.85);

        // Whisk.
        tl.set("#t-whisk", { opacity: 1 }, 15.3);
        tl.fromTo("#t-whisk .ch", { x: (i) => (i % 2 ? 46 : -46), skewX: (i) => (i % 2 ? -14 : 14), opacity: 0 }, { x: 0, skewX: 0, opacity: 1, duration: 0.5, ease: "expo.out", stagger: 0.04 }, 15.3);
        tl.to("#t-whisk", { y: -60, opacity: 0, duration: 0.24, ease: "power2.in" }, 19.72);

        // Ice. → Milk.
        tl.set("#t-ice", { opacity: 1 }, 19.86);
        const iceCh = document.querySelectorAll("#t-ice .ch");
        [19.86, 20.16, 20.48, 20.6].forEach((T, i) => {
          tl.fromTo(iceCh[i], { yPercent: -170, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.4, ease: "bounce.out" }, T);
        });
        tl.to("#t-ice", { y: -60, opacity: 0, duration: 0.22, ease: "power2.in" }, 21.1);
        tl.set("#t-milk", { opacity: 1 }, 21.25);
        tl.fromTo("#t-milk .ch", { opacity: 0, y: 34, filter: "blur(16px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.8, ease: "sine.out", stagger: 0.06 }, 21.25);
        tl.to("#t-milk", { opacity: 0, y: -40, filter: "blur(10px)", duration: 0.3, ease: "power2.in" }, 24.85);


        // One stick. One latte.
        tl.set("#t-hero", { opacity: 1 }, 25.5);
        tl.fromTo("#t-hero .l1", { yPercent: 112 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 25.52);
        tl.fromTo("#t-hero .l2", { yPercent: 112 }, { yPercent: 0, duration: 0.75, ease: "expo.out" }, 25.7);
        tl.to("#t-hero", { y: -56, opacity: 0, duration: 0.26, ease: "power2.in" }, 27.28);

        // CTA
        tl.set("#t-cta", { opacity: 1 }, 27.5);
        tl.fromTo("#cta-glass", { scale: 0, rotation: -12, transformOrigin: "50% 80%" }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(2.2)" }, 27.5);
        tl.fromTo("#cta-word .ch", { yPercent: 120, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.55, ease: "power4.out", stagger: 0.032 }, 27.56);
        tl.fromTo("#cta-tag", { yPercent: 110 }, { yPercent: 0, duration: 0.7, ease: "expo.out" }, 27.82);
        tl.fromTo("#cta-facts", { opacity: 0, y: 14 }, { opacity: 0.85, y: 0, duration: 0.45, ease: "power2.out" }, 28.0);
        tl.fromTo("#cta-pill", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(2.4)" }, 28.1);
        tl.fromTo("#cta-pill .shine", { x: -160 }, { x: 760, duration: 0.9, ease: "power2.inOut" }, 28.7);

        render(0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
